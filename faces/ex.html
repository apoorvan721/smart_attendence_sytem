<!DOCTYPE html>
<html ng-app>
<head>
  <meta charset="UTF-8">
  <title>ng-click Desktop Example</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>
<body>
<p>Counter: {{count}}</p>
<button ng-click="count = count + 1">Click Me</button>
</body>
</html>
